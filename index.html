<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preteky | Beh</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>Bežecké preteky</h1>
  </header>

  <main class="layout">
    <section class="panel">
      <button class="filter-toggle" id="filterToggle" aria-expanded="false">
        <span>Filter pretekov</span><span class="toggle-icon">▾</span>
      </button>
      <div class="panel-body" id="panelBody">
      <div class="field">
        <label for="dateFrom">Dátum od</label>
        <input id="dateFrom" type="date" />
      </div>
      <div class="field">
        <label for="dateTo">Dátum do</label>
        <input id="dateTo" type="date" />
      </div>
      <div class="field">
        <label for="locationFilter">Kraj</label>
        <div id="locationFilter" class="checkbox-list"></div>
      </div>
      <div class="field">
        <label>Dĺžka trate (km)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <input id="distanceMin" type="number" step="0.1" placeholder="Min. km" />
          <input id="distanceMax" type="number" step="0.1" placeholder="Max. km" />
        </div>
      </div>
      <select id="surfaceFilter" multiple hidden></select>
      <div class="button-row">
        <button class="button primary" id="applyFilter">Hľadať</button>
        <button class="button secondary" id="resetFilter">Vymazať filter</button>
      </div>
      </div>
    </section>

    <section>
      <p class="status" id="status">Načítavam preteky…</p>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  
<script src="assets/municipality-region-map.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
