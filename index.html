<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preteky | Beh</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header>
    <h1>Bežecké preteky</h1>
  </header>

  <main class="layout">
    <section class="panel">
      <button class="filter-toggle" id="filterToggle" aria-expanded="false">
        <span>Filter pretekov</span><span class="toggle-icon">▾</span>
      </button>
      <div class="panel-body" id="panelBody">
      <div class="field">
        <label for="dateFrom">Dátum od</label>
        <input id="dateFrom" type="date" />
      </div>
      <div class="field">
        <label>Lokalita</label>
        <div id="countryFilter" class="checkbox-list">
          <label class="checkbox-item">
            <input type="checkbox" id="country-sk" value="Slovensko" />
            <span>Slovensko</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="country-cz" value="Česká republika" />
            <span>Česká republika</span>
          </label>
        </div>
        <select id="locationFilter"></select>
      </div>
      <div class="field">
        <label>Dĺžka trate (km)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <input id="distanceMin" type="number" step="0.1" placeholder="Min. km" />
          <input id="distanceMax" type="number" step="0.1" placeholder="Max. km" />
        </div>
      </div>
      <div class="button-row">
        <button class="button primary" id="applyFilter">Hľadať</button>
        <button class="button secondary" id="resetFilter">Vymazať filter</button>
      </div>
      </div>
    </section>

    <section>
      <p class="status" id="status">Načítavam preteky…</p>
      <div id="map"></div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <footer id="lastUpdate" style="text-align:center;padding:16px;color:var(--muted);font-size:0.8rem;"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/municipality-region-map.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
