name: Daily scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scrapers
        run: |
          python scripts/beh_scraper.py
          python scripts/multi_scraper.py
          python scripts/merge.py
          python scripts/normalize.py

      - name: Write last update timestamp
        run: date -u +%Y-%m-%dT%H:%M:%SZ > data/last_update.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update race data $(date -u +%Y-%m-%d)"
          git push
